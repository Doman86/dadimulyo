# Heap ukuran aman untuk mesin RAM 8 GB (default 8G menyebabkan
# java.lang.OutOfMemoryError saat assembleRelease).
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable Kotlin incremental compilation to avoid cross-drive cache issues
kotlin.incremental=false
kotlin.incremental.compilation=false
kotlin.incremental.useClasspathSnapshot=false
org.gradle.daemon=false
