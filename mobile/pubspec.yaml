name: dadi_mulyo_mobile
description: "Dadi Mulyo - Showroom Truck & Marketplace Jeruk"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  provider: ^6.1.2
  shared_preferences: ^2.3.5
  cached_network_image: ^3.4.1
  device_info_plus: ^11.3.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  # PDF & Printing
  pdf: ^3.10.7
  printing: ^5.12.0
  path_provider: ^2.1.4
  share_plus: ^7.2.1
  # Firebase
  firebase_core: ^2.32.0
  firebase_messaging: ^14.7.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
